{% load i18n %}
{% if messages %}
  <div class="flash-messages editorial-container" aria-live="polite">
    {% for message in messages %}
      <div class="flash-message flash-message--{% if 'error' in message.tags %}error{% elif 'warning' in message.tags %}warning{% elif 'success' in message.tags %}success{% else %}info{% endif %}"{% if 'error' in message.tags or 'warning' in message.tags %} role="alert"{% else %} role="status"{% endif %}>
        <div class="flash-message__icon">
          {% if 'error' in message.tags %}
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
          {% elif 'warning' in message.tags %}
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
          {% elif 'success' in message.tags %}
            <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
          {% else %}
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          {% endif %}
        </div>
        <div class="flash-message__content">
          <p>{{ message }}</p>
        </div>
        <button type="button" class="flash-message__dismiss" data-dismiss-message aria-label="{% translate 'Dismiss message' %}">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
