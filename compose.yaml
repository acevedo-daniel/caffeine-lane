services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: caffeine
      POSTGRES_USER: caffeine
      POSTGRES_PASSWORD: caffeine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
