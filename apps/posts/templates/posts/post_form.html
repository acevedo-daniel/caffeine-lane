{% extends "base.html" %}
{% block title %}{% if object %}Edit{% else %}Create{% endif %} Post{% endblock title %}
{% block content %}
  <main class="max-w-3xl mx-auto py-12 px-4">
    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
      <button type="submit">Save Post</button>
    </form>
  </main>
{% endblock content %}
