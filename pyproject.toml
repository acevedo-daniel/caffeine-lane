[project]
name = "caffeine-lane"
version = "1.0.0"
description = "Django editorial application with accounts, moderation, media management and PostgreSQL."
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.0.8,<6.1",
    "Pillow==12.3.0",
    "cloudinary==1.46.2",
    "dj-database-url==3.1.2",
    "django-cloudinary-storage==0.3.0",
    "django-environ==0.14.0",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    "psycopg[binary]>=3.3.5",
    "argon2-cffi>=25.1.0",
    "django-anymail[resend]>=15.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs==6.1.0",
    "django-stubs-ext==6.1.0",
    "djlint==1.46.1",
    "factory-boy>=3.3.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.vercel.scripts]
# Django is detected from manage.py. Vercel serves static files from its CDN;
# this hook only compiles authored frontend assets. Database releases remain
# explicit through scripts/release.sh or scripts/release.ps1.
build = "pnpm run build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps"]
addopts = "--cov=apps --cov=config --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["apps", "config"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["apps/*/migrations", "README.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
