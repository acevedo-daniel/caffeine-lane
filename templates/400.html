{% extends "base.html" %}
{% block title %}Solicitud inválida · The Caffeine Lane{% endblock %}
{% block content %}
  <section class="error-page flex min-h-[58vh] items-center">
    <div class="relative mx-auto w-full max-w-6xl px-4 py-20 sm:px-6">
      <p class="error-kicker">Error 400</p>
      <h1 class="error-title mt-3 max-w-3xl">Invalid request</h1>
      <p class="mt-6 max-w-xl text-lg leading-8 text-stone-200">We could not process this request. Check the submitted information and try again.</p>
      <a class="mt-8 inline-flex rounded-full bg-white px-6 py-3 text-sm font-extrabold uppercase tracking-wider text-black no-underline transition hover:bg-red-700 hover:text-white" href="{% url 'home' %}">Back to home</a>
    </div>
  </section>
{% endblock %}
