<div class="space-y-2">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="flex items-center gap-3 text-sm font-bold text-stone-800">{{ field }} {{ field.label }}</label>
  {% else %}
    <label class="block text-sm font-bold text-stone-800" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="text-sm leading-5 text-stone-600">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
</div>
