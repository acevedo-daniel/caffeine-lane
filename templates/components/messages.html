{% if messages %}
  <div class="mx-auto max-w-5xl space-y-3 px-4 pt-5 sm:px-6" aria-live="polite">
    {% for message in messages %}
      <p class="rounded-lg border px-4 py-3 text-sm font-medium {% if 'error' in message.tags %}border-red-300 bg-red-50 text-red-900{% elif 'success' in message.tags %}border-emerald-300 bg-emerald-50 text-emerald-900{% else %}border-stone-300 bg-white text-stone-800{% endif %}">{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}
