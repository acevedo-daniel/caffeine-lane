<!doctype html>
<html lang="en">
  <body>
    <h1>Reset your password</h1>
    <p>You requested a password reset for {{ site_name }}.</p>
    <p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}">Choose a new password</a></p>
    <p>If you did not request this, you can safely ignore this email.</p>
  </body>
</html>
