name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies (locked)
        run: uv sync --locked
      - name: Run Ruff linter
        run: uv run ruff check .
      - name: Verify Ruff formatting
        run: uv run ruff format --check .
      - name: Run Django system checks
        run: uv run python manage.py check
      - name: Verify migration state
        run: uv run python manage.py makemigrations --settings=config.settings.test --check --dry-run

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: caffeine-lane
          POSTGRES_USER: caffeine-lane
          POSTGRES_PASSWORD: caffeine-lane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caffeine-lane -d caffeine-lane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies (locked)
        run: uv sync --locked
      - name: Run Python tests against PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          TEST_DATABASE_URL: "postgresql://caffeine-lane:caffeine-lane@localhost:5432/caffeine-lane"
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
          DEFAULT_FROM_EMAIL: noreply@example.test
          CONTACT_RECIPIENT_EMAIL: owner@example.test
        run: uv run pytest
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies (locked)
        run: pnpm install --frozen-lockfile
      - name: Run frontend unit tests
        run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies (locked)
        run: uv sync --locked
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies (locked)
        run: pnpm install --frozen-lockfile
      - name: Build frontend assets
        run: pnpm run build
      - name: Prepare isolated browser data
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          DATABASE_URL: "sqlite:////tmp/caffeine-lane-e2e.sqlite3"
          DEBUG_TOOLBAR_ENABLED: "false"
        run: |
          rm -f /tmp/caffeine-lane-e2e.sqlite3
          uv run python manage.py check_fresh_baseline
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_editorial
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke tests
        env:
          E2E_DATABASE_URL: "sqlite:////tmp/caffeine-lane-e2e.sqlite3"
        run: pnpm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  production:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies (locked)
        run: uv sync --locked
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies (locked)
        run: pnpm install --frozen-lockfile
      - name: Build production assets
        run: pnpm run build
      - name: Verify Vercel build contract
        run: >-
          uv run python -c "import tomllib; config = tomllib.load(open('pyproject.toml', 'rb')); assert config['tool']['vercel']['scripts']['build'] == 'pnpm run build'"
      - name: Check production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-production-secret-key-not-for-production-0123456789
          DATABASE_URL: "sqlite:///:memory:"
          ALLOWED_HOSTS: example.test
          CSRF_TRUSTED_ORIGINS: "https://example.test"
          CLOUDINARY_URL: "cloudinary://123456789012345:ci-secret@example"
          RESEND_API_KEY: re_ci_not_a_real_key
          DEFAULT_FROM_EMAIL: noreply@example.test
          CONTACT_RECIPIENT_EMAIL: owner@example.test
          USE_X_FORWARDED_PROTO: "true"
          CSP_ENFORCE: "false"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: uv run python manage.py check --deploy

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t caffeine-lane-ci .
      - name: Verify generated asset in image
        shell: bash
        run: |
          set -euo pipefail
          source_hash=$(sha256sum static/src/js/home-carousel.js | awk '{print $1}')
          image_hash=$(docker run --rm --entrypoint sha256sum caffeine-lane-ci /app/static/dist/js/home-carousel.js | awk '{print $1}')
          test "$source_hash" = "$image_hash"
      - name: Start image and verify public endpoints
        shell: bash
        env:
          CONTAINER_NAME: caffeine-lane-ci
          CONTAINER_PORT: "10000"
        run: |
          set -euo pipefail
          docker image inspect caffeine-lane-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -qx 'SEED_EDITORIAL_ON_START=false'
          docker run --detach --name "$CONTAINER_NAME" --publish "$CONTAINER_PORT:$CONTAINER_PORT" \
            --env PORT="$CONTAINER_PORT" \
            --env DJANGO_SETTINGS_MODULE=config.settings.production \
            --env SECRET_KEY=ci-docker-secret-key-not-for-production-0123456789 \
            --env DATABASE_URL=sqlite:////tmp/caffeine-lane-ci.sqlite3 \
            --env DIRECT_DATABASE_URL=sqlite:////tmp/caffeine-lane-ci.sqlite3 \
            --env ALLOWED_HOSTS=localhost,127.0.0.1 \
            --env CSRF_TRUSTED_ORIGINS=https://localhost \
            --env CLOUDINARY_URL=cloudinary://123456789012345:ci-secret@example \
            --env RESEND_API_KEY=re_ci_not_a_real_key \
            --env DEFAULT_FROM_EMAIL=noreply@example.test \
            --env CONTACT_RECIPIENT_EMAIL=owner@example.test \
            --env USE_X_FORWARDED_PROTO=true \
            --env CSP_ENFORCE=false \
            --env RUN_MIGRATIONS_ON_START=true \
            --env SEED_EDITORIAL_ON_START=false \
            caffeine-lane-ci
          cleanup() {
            docker logs "$CONTAINER_NAME" || true
            docker rm --force "$CONTAINER_NAME" || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:$CONTAINER_PORT/healthz/"; then
              break
            fi
            sleep 1
            if [ "$attempt" = 30 ]; then
              echo "The container did not expose a healthy HTTP endpoint."
              exit 1
            fi
          done
          secure_header='X-Forwarded-Proto: https'
          curl --fail --silent --show-error -H "$secure_header" "http://127.0.0.1:$CONTAINER_PORT/home/" >/dev/null
          curl --fail --silent --show-error -H "$secure_header" "http://127.0.0.1:$CONTAINER_PORT/static/dist/css/app.css" >/dev/null
          curl --fail --silent --show-error -H "$secure_header" "http://127.0.0.1:$CONTAINER_PORT/static/dist/js/home-carousel.js" >/dev/null

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - quality
      - tests
      - e2e
      - production
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          echo "Quality:    ${{ needs.quality.result }}"
          echo "Tests:      ${{ needs.tests.result }}"
          echo "E2E:        ${{ needs.e2e.result }}"
          echo "Production: ${{ needs.production.result }}"
          echo "Docker:     ${{ needs.docker.result }}"
          for result in \
            "${{ needs.quality.result }}" \
            "${{ needs.tests.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.production.result }}" \
            "${{ needs.docker.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job failed, was cancelled, or was skipped."
              exit 1
            fi
          done
          echo "All required CI gates completed successfully. Safe to merge."
